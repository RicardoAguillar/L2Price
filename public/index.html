<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L2Price — Mercado C1 · L2 Reborn Legacy</title>
<link rel="icon" href="icons/etc_crystal_gold_i00.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="icons/etc_crystal_gold_i00.png" alt="">
    <div><b>L2Price</b><small id="serverName">L2 Reborn · Legacy C1</small></div>
  </div>
  <nav>
    <a href="#/dashboard" data-route="dashboard"><span>◈</span>Painel</a>
    <a href="#/mercado" data-route="mercado"><span>⚖</span>Mercado</a>
    <a href="#/lote" data-route="lote"><span>✎</span>Atualizar preços</a>
    <a href="#/oportunidades" data-route="oportunidades"><span>★</span>Oportunidades</a>
    <a href="#/carteira" data-route="carteira"><span>⛁</span>Carteira</a>
    <a href="#/catalogo" data-route="catalogo"><span>☰</span>Catálogo C1</a>
    <a href="#/config" data-route="config"><span>⚙</span>Backup & Ajustes</a>
  </nav>
  <button class="btn quick" id="loginBtn" hidden>🔑 Entrar (administrador)</button>
  <button class="btn gold quick" id="quickBtn">+ Registrar preço <kbd>N</kbd></button>
  <div class="side-foot"><div id="userBox" hidden><span id="userEmail"></span> · <a href="#" id="pwdBtn">trocar senha</a> · <a href="#" id="logoutBtn">sair</a><br><span class="tag hold" id="roleTag"></span></div>Dados de itens e ícones: l2hub.info (C1)</div>
</aside>
<div class="login-bg" id="loginBg" hidden>
  <form class="login" id="loginForm">
    <button type="button" class="btn ghost sm" id="lgClose" style="align-self:flex-end;margin:-12px -12px 0 0">✕</button>
    <img src="icons/etc_crystal_gold_i00.png" alt="">
    <h1>L2Price</h1>
    <p class="sub" id="loginSub">Acesso para administradores registrarem e editarem preços</p>
    <label class="f">E-mail<input type="email" id="lgEmail" required autocomplete="email"></label>
    <label class="f">Senha<input type="password" id="lgPass" required minlength="6" autocomplete="current-password"></label>
    <button class="btn gold" type="submit" id="lgBtn">Entrar</button>
    <a href="#" id="lgForgot">Esqueci minha senha</a>
    <div class="pricehelp" id="lgMsg"></div>
  </form>
</div>
<main id="app"></main>

<div class="modal-bg" id="modalBg" hidden>
  <div class="modal" id="modal"></div>
</div>
<div id="toasts"></div>
<div id="tip" class="tip" hidden></div>
<script>window.__authType = (location.hash.match(/type=(invite|recovery|signup)/) || [])[1] || "";</script>
<script type="module" src="app.js?v=11"></script>
</body>
</html>
